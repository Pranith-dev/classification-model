<!DOCTYPE html>
<html>

<head>
    <title>Iris Classification</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            text-align:center;
            padding:40px;
        }

        form{
            background:white;
            width:300px;
            margin:auto;
            padding:20px;
            border-radius:10px;
        }

        input{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            color:blue;
        }
    </style>

</head>

<body>

<h1>Iris Flower Classifier</h1>

<form action="/predict" method="POST">

<input type="text" name="sl" placeholder="Sepal Length" required>

<input type="text" name="sw" placeholder="Sepal Width" required>

<input type="text" name="pl" placeholder="Petal Length" required>

<input type="text" name="pw" placeholder="Petal Width" required>

<button type="submit">
Predict
</button>

</form>

{% if prediction %}

<h2>
Prediction : {{ prediction }}
</h2>

{% endif %}

</body>

</html>
